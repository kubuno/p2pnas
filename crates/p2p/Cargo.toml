[package]
name        = "p2pnas-p2p"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-only"
description = "p2pnas — embedded peer-to-peer transport (handshake + shard store/fetch)"

[dependencies]
tokio       = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
tracing     = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
