[package]
name        = "kubuno-p2pnas"
version     = "0.1.0-alpha"
edition     = "2021"
description = "Kubuno p2pnas — encrypted peer-to-peer NAS module"
license     = "AGPL-3.0-only"
repository  = "https://github.com/kubuno/p2pnas"

[[bin]]
name = "kubuno-p2pnas"
path = "src/main.rs"

[dependencies]
p2pnas-core  = { path = "../core" }
p2pnas-store = { path = "../store" }
p2pnas-p2p   = { path = "../p2p" }
async-trait  = "0.1"

# Per-thread-heap allocator — avoids glibc arena/mmap contention when the
# data-parallel pipeline (rayon) allocates chunk buffers across cores.
mimalloc = "0.1"

# Kubuno module runtime (mirrors the calendar pilot's stack).
tokio              = { version = "1",    features = ["full"] }
axum               = { version = "0.7",  features = ["macros"] }
tower              = { version = "0.5",  features = ["full"] }
tower-http         = { version = "0.6",  features = ["trace"] }
# All three drivers are compiled in; the engine is a run-time choice made by
# kubuno-db. The FromRow derive on the tuples/structs decoded here resolves
# against the three row types, so the three drivers must be present.
sqlx               = { version = "0.9",  default-features = false, features = ["runtime-tokio", "postgres", "mysql", "sqlite", "uuid", "chrono", "json", "migrate", "tls-rustls"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
reqwest            = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
config             = "0.14"
dotenvy            = "0.15"
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter", "json"] }
thiserror          = "1"
anyhow             = "1"
uuid               = { version = "1",    features = ["v4", "serde"] }
chrono             = { version = "0.4",  features = ["serde"] }
clap               = { version = "4",    features = ["derive", "env"] }
toml               = "0.8"

# Zero-config LAN peer discovery (pure-Rust mDNS/DNS-SD; spawns threads, never
# a subprocess, so it stays within the seccomp execve ban).
mdns-sd            = "0.11"


# Shared core crates — git tags in prod, patched to a local checkout for offline dev.
kubuno-seccomp = { git = "https://github.com/kubuno/core", tag = "seccomp-v0.1.1", package = "kubuno-seccomp" }
# Signed identity token minted by the core proxy (HMAC-SHA256, short expiry,
# module-scoped audience). Replaces blind trust in the `X-Kubuno-User-*` headers.
kubuno-modauth = { git = "https://github.com/kubuno/core", tag = "modauth-v0.1.0", package = "kubuno-modauth" }
# Multi-engine database foundation: one binary over PostgreSQL, MySQL/MariaDB or
# SQLite, the engine chosen at run time. Only the control plane goes through it;
# the local SQLCipher manifest (crates/store) is untouched.
kubuno-db      = { git = "https://github.com/kubuno/core", tag = "db-v0.6.0", package = "kubuno-db" }

[dev-dependencies]
tempfile = "3"
