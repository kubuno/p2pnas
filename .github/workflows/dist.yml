name: Distributions (.kbpkg Windows / macOS)

# Paquet Kubuno (.kbpkg) du module pour Windows et macOS, attaché à la Release
# GitHub sur tag v*. Complète build.yml (qui produit le .kbpkg Linux).
#
# Un module s'empaquette et s'installe UNIQUEMENT au format .kbpkg — le seul que
# le serveur déballe sans outil externe, donc le seul identique sur les trois
# systèmes. Les paquets natifs (.rpm/.exe/.pkg) ne sont plus produits.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # build_kbpkg.sh compile le binaire (cross msvc via TARGET) + le frontend,
      # puis empaquette. Le serveur sait déballer ce ZIP sans outil externe.
      - run: bash build_kbpkg.sh
        env: { SQLX_OFFLINE: "true", OS: windows, ARCH: x86_64, TARGET: x86_64-pc-windows-msvc }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.kbpkg }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.kbpkg }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bash build_kbpkg.sh
        env: { SQLX_OFFLINE: "true", OS: macos, ARCH: aarch64, TARGET: aarch64-apple-darwin }
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.kbpkg }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.kbpkg }
