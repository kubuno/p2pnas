[module]
id           = "p2pnas"
# Technical module name shown in the admin module list. The user-facing storage
# it provides appears in Drive as a "My Cloud" mount (not as a launcher app).
display_name = "p2pnas"
version      = "0.1.0"
description  = "Stockage pair-à-pair chiffré et auto-réparant (montage « My Cloud » dans Drive)"
author       = "Kubuno Contributors"
license      = "AGPL-3.0"
runtime      = "rust"
settings_path = "/p2pnas/settings"

[process]
entrypoint = "kubuno-p2pnas"
args       = []

[server]
host = "127.0.0.1"
port = 3119

[routes]
patterns = [
    { method = "*", path = "/*" },
]

# No sidebar_items / launcher app on purpose: p2pnas is a storage backend. Its
# "My Cloud" surface appears inside Drive as a mount (see the frontend).

[events]
# Cleans up a user's quota row when their account is removed.
subscribed = [
    "UserDeleted",
]
# Lets the drive module react when p2pnas stores/updates a file (phase 5).
publishes = [
    "P2pnasFileStored",
]
